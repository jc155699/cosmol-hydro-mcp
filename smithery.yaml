# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      cosmolHydroUrl:
        type: string
        default: "https://hydro.cosmolsesc.com"
        description: "COSMOL HydroGeo Studio base URL"
      cosmolApiToken:
        type: string
        default: ""
        description: "Optional GLBH-* Bearer token (omit for 2 free + 3 email bonus runs = 5 free)"
  commandFunction:
    |-
    (config) => ({
      command: "python3",
      args: ["cosmol_hydro_mcp.py"],
      env: {
        COSMOL_HYDRO_URL: config.cosmolHydroUrl || "https://hydro.cosmolsesc.com",
        COSMOL_API_TOKEN: config.cosmolApiToken || ""
      }
    })
