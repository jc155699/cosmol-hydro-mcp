[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmol-hydrogeo-mcp"
version = "2.0.0"
description = "Zero-dependency MCP server & CLI for COSMOL HydroGeo Studio (M00-M04 Multi-Physics Cloud Engine)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "COSMOL HydroGeo Studio", email = "support@cosmolsesc.com"}]
keywords = ["mcp", "model-context-protocol", "hydrology", "flood-modeling", "modflow", "gis", "urban-drainage", "sediment-transport"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = []

[project.urls]
Homepage = "https://hydro.cosmolsesc.com/"
Repository = "https://github.com/jc155699/cosmol-hydro-mcp"
Documentation = "https://hydro.cosmolsesc.com/llms.txt"

[project.scripts]
cosmol-hydrogeo-mcp = "cosmol_hydro_mcp:main"
cosmol-hydrogeo = "scripts.hydro_cloud_cli:main"

[tool.setuptools]
py-modules = ["cosmol_hydro_mcp"]
packages = ["scripts"]
